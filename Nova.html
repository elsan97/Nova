<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Nova Language</title>

<!-- CodeMirror 5 (подсветка, автодополнение скобок, поиск) -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0e14;
    color: #c9d1d9;
    font-family: 'JetBrains Mono', 'Courier New', monospace;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    padding: 10px 16px;
    background: #11151c;
    border-bottom: 1px solid #1f2937;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  header h1 {
    font-size: 15px;
    color: #58a6ff;
    letter-spacing: 3px;
    font-weight: 600;
  }
  header .badge {
    font-size: 10px;
    padding: 2px 8px;
    border: 1px solid #58a6ff;
    border-radius: 10px;
    color: #58a6ff;
    letter-spacing: 1px;
  }
  header .spacer { flex: 1; }
  header button, header label.btn {
    background: #21262d;
    border: 1px solid #30363d;
    color: #c9d1d9;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    transition: all 0.15s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  header button:hover, header label.btn:hover {
    background: #30363d;
    border-color: #58a6ff;
    color: #58a6ff;
  }
  header button.run {
    background: #238636;
    border-color: #2ea043;
    color: #fff;
  }
  header button.run:hover { background: #2ea043; }
  header button.danger:hover { border-color: #f85149; color: #f85149; }
  header input[type="file"] { display: none; }

  #main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  #editor-pane, #output-pane {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #editor-pane { width: 55%; border-right: 1px solid #1f2937; }
  #output-pane { width: 45%; }

  .pane-header {
    padding: 6px 14px;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #6e7681;
    background: #0d1117;
    border-bottom: 1px solid #1f2937;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .pane-header .filename {
    color: #58a6ff;
    text-transform: none;
    letter-spacing: 0;
    font-size: 12px;
  }
  .pane-header .modified {
    color: #d29922;
    font-size: 11px;
    display: none;
  }
  .pane-header .modified.show { display: inline; }

  /* CodeMirror */
  #editor-container {
    flex: 1;
    overflow: hidden;
  }
  .CodeMirror {
    height: 100% !important;
    font-family: 'JetBrains Mono', 'Courier New', monospace !important;
    font-size: 13px !important;
    line-height: 1.55 !important;
  }

  #output {
    flex: 1;
    padding: 12px 14px;
    background: #0a0e14;
    overflow: auto;
    font-size: 13px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .out-line { margin-bottom: 2px; }
  .out-info { color: #58a6ff; }
  .out-error { color: #f85149; }
  .out-value { color: #79c0ff; }
  .out-muted { color: #6e7681; }
  .out-success { color: #3fb950; }
  .out-warn { color: #d29922; }
  .out-help { color: #a5d6ff; }
  .out-help b { color: #ffa657; }

  #repl {
    display: flex;
    border-top: 1px solid #1f2937;
    background: #0d1117;
  }
  #repl-prompt {
    padding: 10px 0 10px 14px;
    color: #58a6ff;
    font-size: 13px;
    user-select: none;
  }
  #repl-input {
    flex: 1;
    padding: 10px 14px 10px 8px;
    background: transparent;
    border: none;
    outline: none;
    color: #c9d1d9;
    font-family: inherit;
    font-size: 13px;
    caret-color: #58a6ff;
  }

  /* Drag-and-drop overlay */
  #drop-overlay {
    position: fixed;
    inset: 0;
    background: rgba(88, 166, 255, 0.15);
    border: 3px dashed #58a6ff;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    color: #58a6ff;
    z-index: 100;
    pointer-events: none;
  }
  #drop-overlay.show { display: flex; }

  /* Тост */
  #toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #238636;
    color: #fff;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 13px;
    letter-spacing: 1px;
    opacity: 0;
    transition: all 0.3s;
    z-index: 200;
  }
  #toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  #toast.err { background: #da3633; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: #0d1117; }
  ::-webkit-scrollbar-thumb { background: #21262d; border-radius: 5px; }
  ::-webkit-scrollbar-thumb:hover { background: #30363d; }
</style>
</head>
<body>

<header>
  <h1>NOVA</h1>
  <span class="badge">v1.1</span>
  <span class="spacer"></span>
  <button id="btn-run" class="run">▶ Запуск (Ctrl+Enter)</button>
  <button id="btn-save">💾 Сохранить</button>
  <label class="btn" for="file-input">📂 Открыть</label>
  <input id="file-input" type="file" accept=".nv,.txt,text/plain">
  <button id="btn-new" class="danger">＋ Новый</button>
  <button id="btn-clear">Очистить вывод</button>
</header>

<div id="main">
  <div id="editor-pane">
    <div class="pane-header">
      <span>Редактор</span>
      <span class="filename" id="current-file">untitled.nv</span>
      <span class="modified" id="modified-dot">● изменено</span>
    </div>
    <div id="editor-container"></div>
    <div id="repl">
      <span id="repl-prompt">nova&gt;</span>
      <input id="repl-input" autocomplete="off" spellcheck="false"
             placeholder="help — список команд | выражение и Enter">
    </div>
  </div>
  <div id="output-pane">
    <div class="pane-header">
      <span>Вывод</span>
    </div>
    <div id="output"></div>
  </div>
</div>

<div id="drop-overlay">📂 Отпусти .nv файл</div>
<div id="toast"></div>

<script>
// ============================================================
//  NOVA — интерпретируемый язык программирования (v1.1)
//  Лексер → Парсер (Pratt) → AST → Tree-walking интерпретатор
// ============================================================

// ==================== ТОКЕНЫ ====================
const TT = {
  NUMBER: 'NUMBER', STRING: 'STRING', IDENT: 'IDENT',
  LET: 'LET', CONST: 'CONST', FN: 'FN', IF: 'IF', ELSE: 'ELSE',
  WHILE: 'WHILE', FOR: 'FOR', RETURN: 'RETURN', BREAK: 'BREAK',
  CONTINUE: 'CONTINUE', TRUE: 'TRUE', FALSE: 'FALSE', NULL: 'NULL',
  PLUS: '+', MINUS: '-', STAR: '*', SLASH: '/', PERCENT: '%', POW: '**',
  ASSIGN: '=', EQ: '==', NEQ: '!=', LT: '<', GT: '>', LTE: '<=', GTE: '>=',
  AND: '&&', OR: '||', NOT: '!',
  LPAREN: '(', RPAREN: ')', LBRACE: '{', RBRACE: '}',
  LBRACKET: '[', RBRACKET: ']',
  COMMA: ',', SEMI: ';', COLON: ':', DOT: '.',
  EOF: 'EOF'
};

class Token {
  constructor(type, value, line, col) {
    this.type = type; this.value = value; this.line = line; this.col = col;
  }
}

class NovaError extends Error {
  constructor(message, line, col, kind = 'Ошибка') {
    super(message);
    this.line = line; this.col = col; this.kind = kind;
  }
  format() { return `${this.kind} [${this.line}:${this.col}]: ${this.message}`; }
}

// ==================== ЛЕКСЕР (с поддержкой Unicode) ====================
// \p{L} — любая буква Unicode (включая кириллицу, китайский, арабский)
// \p{N} — числа Unicode
const RE_IDENT_START = /[\p{L}_$]/u;
const RE_IDENT_PART  = /[\p{L}\p{N}_$]/u;

class Lexer {
  constructor(source) {
    this.src = source;
    this.pos = 0;
    this.line = 1;
    this.col = 1;
    this.tokens = [];
    this.keywords = {
      'let': TT.LET, 'const': TT.CONST, 'fn': TT.FN,
      'if': TT.IF, 'else': TT.ELSE, 'while': TT.WHILE,
      'for': TT.FOR, 'return': TT.RETURN, 'break': TT.BREAK,
      'continue': TT.CONTINUE, 'true': TT.TRUE, 'false': TT.FALSE,
      'null': TT.NULL
    };
  }
  peek(off = 0) { return this.src[this.pos + off]; }
  advance() {
    const c = this.src[this.pos++];
    if (c === '\n') { this.line++; this.col = 1; } else { this.col++; }
    return c;
  }
  match(str) {
    if (this.src.startsWith(str, this.pos)) {
      for (let i = 0; i < str.length; i++) this.advance();
      return true;
    }
    return false;
  }
  add(type, value, line, col) { this.tokens.push(new Token(type, value, line, col)); }

  tokenize() {
    while (this.pos < this.src.length) {
      this.skipWhitespaceAndComments();
      if (this.pos >= this.src.length) break;
      const line = this.line, col = this.col;
      const c = this.peek();

      if (/[0-9]/.test(c) || (c === '.' && /[0-9]/.test(this.peek(1)))) {
        this.readNumber(line, col); continue;
      }
      if (c === '"' || c === "'") { this.readString(c, line, col); continue; }
      if (RE_IDENT_START.test(c)) { this.readIdent(line, col); continue; }

      if (this.match('**')) { this.add(TT.POW, '**', line, col); continue; }
      if (this.match('==')) { this.add(TT.EQ, '==', line, col); continue; }
      if (this.match('!=')) { this.add(TT.NEQ, '!=', line, col); continue; }
      if (this.match('<=')) { this.add(TT.LTE, '<=', line, col); continue; }
      if (this.match('>=')) { this.add(TT.GTE, '>=', line, col); continue; }
      if (this.match('&&')) { this.add(TT.AND, '&&', line, col); continue; }
      if (this.match('||')) { this.add(TT.OR, '||', line, col); continue; }

      const singles = {
        '+': TT.PLUS, '-': TT.MINUS, '*': TT.STAR, '/': TT.SLASH,
        '%': TT.PERCENT, '=': TT.ASSIGN, '<': TT.LT, '>': TT.GT,
        '!': TT.NOT, '(': TT.LPAREN, ')': TT.RPAREN,
        '{': TT.LBRACE, '}': TT.RBRACE, '[': TT.LBRACKET, ']': TT.RBRACKET,
        ',': TT.COMMA, ';': TT.SEMI, ':': TT.COLON, '.': TT.DOT
      };
      if (singles[c]) { this.advance(); this.add(singles[c], c, line, col); continue; }

      throw new NovaError(`Неизвестный символ '${c}'`, line, col, 'Лексер');
    }
    this.add(TT.EOF, null, this.line, this.col);
    return this.tokens;
  }

  skipWhitespaceAndComments() {
    while (this.pos < this.src.length) {
      const c = this.peek();
      if (c === ' ' || c === '\t' || c === '\r' || c === '\n') { this.advance(); }
      else if (this.match('//')) { while (this.pos < this.src.length && this.peek() !== '\n') this.advance(); }
      else if (this.match('/*')) { while (this.pos < this.src.length && !this.match('*/')) this.advance(); }
      else break;
    }
  }

  readNumber(line, col) {
    let s = '';
    while (this.pos < this.src.length && /[0-9.]/.test(this.peek())) s += this.advance();
    this.add(TT.NUMBER, parseFloat(s), line, col);
  }

  readString(quote, line, col) {
    this.advance();
    let s = '';
    while (this.pos < this.src.length && this.peek() !== quote) {
      if (this.peek() === '\\') {
        this.advance();
        const esc = this.advance();
        const map = { n: '\n', t: '\t', r: '\r', '\\': '\\', '"': '"', "'": "'", '0': '\0' };
        s += map[esc] !== undefined ? map[esc] : esc;
      } else s += this.advance();
    }
    if (this.pos >= this.src.length) throw new NovaError('Незакрытая строка', line, col, 'Лексер');
    this.advance();
    this.add(TT.STRING, s, line, col);
  }

  readIdent(line, col) {
    let s = '';
    // Первый символ уже проверен как валидный старт
    while (this.pos < this.src.length && RE_IDENT_PART.test(this.peek())) s += this.advance();
    const kw = this.keywords[s];
    this.add(kw || TT.IDENT, s, line, col);
  }
}

// ==================== AST ====================
const Node = {
  Program: 'Program',
  Number: 'Number', String: 'String', Bool: 'Bool', Null: 'Null', Ident: 'Ident',
  Binary: 'Binary', Unary: 'Unary', Logical: 'Logical',
  Assign: 'Assign', Call: 'Call', Index: 'Index', Member: 'Member',
  Array: 'Array', Object: 'Object',
  Let: 'Let', Block: 'Block', If: 'If', While: 'While', For: 'For',
  FnDecl: 'FnDecl', Return: 'Return', Break: 'Break', Continue: 'Continue',
  ExprStmt: 'ExprStmt'
};

// ==================== ПАРСЕР ====================
class Parser {
  constructor(tokens, source) {
    this.tokens = tokens; this.source = source; this.pos = 0;
    this.loopDepth = 0; this.fnDepth = 0;
  }
  peek(off = 0) { return this.tokens[this.pos + off]; }
  curr() { return this.tokens[this.pos]; }
  advance() { return this.tokens[this.pos++]; }
  is(type) { return this.curr().type === type; }
  expect(type, msg) {
    if (!this.is(type)) {
      const t = this.curr();
      throw new NovaError(msg || `Ожидался ${type}, получен ${t.type}`, t.line, t.col, 'Парсер');
    }
    return this.advance();
  }
  parse() {
    const body = [];
    while (!this.is(TT.EOF)) body.push(this.parseStatement());
    return { type: Node.Program, body };
  }
  parseStatement() {
    const t = this.curr();
    if (this.is(TT.LET) || this.is(TT.CONST)) return this.parseLet();
    if (this.is(TT.FN)) return this.parseFnDecl();
    if (this.is(TT.IF)) return this.parseIf();
    if (this.is(TT.WHILE)) return this.parseWhile();
    if (this.is(TT.FOR)) return this.parseFor();
    if (this.is(TT.RETURN)) return this.parseReturn();
    if (this.is(TT.BREAK)) {
      const tk = this.advance(); this.matchSemi();
      if (this.loopDepth === 0) throw new NovaError('break вне цикла', tk.line, tk.col, 'Парсер');
      return { type: Node.Break, line: tk.line, col: tk.col };
    }
    if (this.is(TT.CONTINUE)) {
      const tk = this.advance(); this.matchSemi();
      if (this.loopDepth === 0) throw new NovaError('continue вне цикла', tk.line, tk.col, 'Парсер');
      return { type: Node.Continue, line: tk.line, col: tk.col };
    }
    if (this.is(TT.LBRACE)) return this.parseBlock();
    const expr = this.parseExpression();
    this.matchSemi();
    return { type: Node.ExprStmt, expr, line: t.line, col: t.col };
  }
  matchSemi() { if (this.is(TT.SEMI)) this.advance(); }
  parseLet() {
    const kw = this.advance();
    const isConst = kw.type === TT.CONST;
    const name = this.expect(TT.IDENT, 'Ожидалось имя переменной после let/const');
    let value = null;
    if (this.matchTok(TT.ASSIGN)) value = this.parseExpression();
    this.matchSemi();
    return { type: Node.Let, name: name.value, value, constant: isConst, line: kw.line, col: kw.col };
  }
  parseFnDecl() {
    const fnTok = this.advance();
    const name = this.expect(TT.IDENT, 'Ожидалось имя функции после fn');
    this.expect(TT.LPAREN, 'Ожидалась ( после имени функции');
    const params = [];
    if (!this.is(TT.RPAREN)) {
      do { params.push(this.expect(TT.IDENT, 'Ожидалось имя параметра').value); }
      while (this.matchTok(TT.COMMA));
    }
    this.expect(TT.RPAREN, 'Ожидалась )');
    this.expect(TT.LBRACE, 'Ожидалась { в теле функции');
    this.fnDepth++;
    const body = this.parseBlockBody();
    this.fnDepth--;
    return { type: Node.FnDecl, name: name.value, params, body, line: fnTok.line, col: fnTok.col };
  }
  parseBlock() {
    this.expect(TT.LBRACE);
    return { type: Node.Block, body: this.parseBlockBody() };
  }
  parseBlockBody() {
    const body = [];
    while (!this.is(TT.RBRACE) && !this.is(TT.EOF)) body.push(this.parseStatement());
    this.expect(TT.RBRACE, 'Ожидалась }');
    return body;
  }
  parseIf() {
    const ifTok = this.advance();
    this.expect(TT.LPAREN, 'Ожидалась ( после if');
    const cond = this.parseExpression();
    this.expect(TT.RPAREN, 'Ожидалась ) после условия');
    const then = this.parseStatement();
    let elseBranch = null;
    if (this.is(TT.ELSE)) { this.advance(); elseBranch = this.parseStatement(); }
    return { type: Node.If, cond, then, elseBranch, line: ifTok.line, col: ifTok.col };
  }
  parseWhile() {
    const w = this.advance();
    this.expect(TT.LPAREN);
    const cond = this.parseExpression();
    this.expect(TT.RPAREN);
    this.loopDepth++;
    const body = this.parseStatement();
    this.loopDepth--;
    return { type: Node.While, cond, body, line: w.line, col: w.col };
  }
  parseFor() {
    const f = this.advance();
    this.expect(TT.LPAREN);
    let init = null;
    if (!this.is(TT.SEMI)) {
      if (this.is(TT.LET) || this.is(TT.CONST)) init = this.parseLet();
      else { init = this.parseExpression(); this.matchSemi(); }
    } else this.advance();
    let cond = null;
    if (!this.is(TT.SEMI)) cond = this.parseExpression();
    this.expect(TT.SEMI, 'Ожидалась ; в for');
    let update = null;
    if (!this.is(TT.RPAREN)) update = this.parseExpression();
    this.expect(TT.RPAREN, 'Ожидалась ) в for');
    this.loopDepth++;
    const body = this.parseStatement();
    this.loopDepth--;
    return { type: Node.For, init, cond, update, body, line: f.line, col: f.col };
  }
  parseReturn() {
    const r = this.advance();
    if (this.fnDepth === 0) throw new NovaError('return вне функции', r.line, r.col, 'Парсер');
    let value = null;
    if (!this.is(TT.SEMI) && !this.is(TT.RBRACE) && !this.is(TT.EOF)) value = this.parseExpression();
    this.matchSemi();
    return { type: Node.Return, value, line: r.line, col: r.col };
  }
  matchTok(type) { if (this.is(type)) { this.advance(); return true; } return false; }
  getPrecedence(type) {
    const p = {
      [TT.OR]: 1, [TT.AND]: 2, [TT.EQ]: 3, [TT.NEQ]: 3,
      [TT.LT]: 4, [TT.GT]: 4, [TT.LTE]: 4, [TT.GTE]: 4,
      [TT.PLUS]: 5, [TT.MINUS]: 5, [TT.STAR]: 6, [TT.SLASH]: 6, [TT.PERCENT]: 6,
      [TT.POW]: 8
    };
    return p[type] || 0;
  }
  parseExpression() { return this.parseAssignment(); }
  parseAssignment() {
    const left = this.parseBinary(0);
    if (this.is(TT.ASSIGN)) {
      const opTok = this.advance();
      const right = this.parseAssignment();
      if (left.type !== Node.Ident && left.type !== Node.Index && left.type !== Node.Member)
        throw new NovaError('Недопустимая цель присваивания', opTok.line, opTok.col, 'Парсер');
      return { type: Node.Assign, target: left, value: right, line: opTok.line, col: opTok.col };
    }
    return left;
  }
  parseBinary(minPrec) {
    let left = this.parseUnary();
    while (true) {
      const t = this.curr();
      if (t.type === TT.POW) {
        const prec = this.getPrecedence(t.type);
        if (prec < minPrec) break;
        const op = this.advance();
        const right = this.parseBinary(prec);
        left = { type: Node.Binary, op: op.value, left, right, line: op.line, col: op.col };
        continue;
      }
      const prec = this.getPrecedence(t.type);
      if (prec === 0 || prec < minPrec) break;
      const op = this.advance();
      const right = this.parseBinary(prec + 1);
      const isLogical = (op.type === TT.AND || op.type === TT.OR);
      left = { type: isLogical ? Node.Logical : Node.Binary, op: op.value, left, right, line: op.line, col: op.col };
    }
    return left;
  }
  parseUnary() {
    const t = this.curr();
    if (t.type === TT.MINUS || t.type === TT.NOT) {
      this.advance();
      return { type: Node.Unary, op: t.value, operand: this.parseUnary(), line: t.line, col: t.col };
    }
    return this.parsePostfix();
  }
  parsePostfix() {
    let expr = this.parsePrimary();
    while (true) {
      if (this.is(TT.LPAREN)) {
        const p = this.advance();
        const args = [];
        if (!this.is(TT.RPAREN)) do { args.push(this.parseExpression()); } while (this.matchTok(TT.COMMA));
        this.expect(TT.RPAREN, 'Ожидалась )');
        expr = { type: Node.Call, callee: expr, args, line: p.line, col: p.col };
      } else if (this.is(TT.LBRACKET)) {
        const b = this.advance();
        const index = this.parseExpression();
        this.expect(TT.RBRACKET, 'Ожидалась ]');
        expr = { type: Node.Index, object: expr, index, line: b.line, col: b.col };
      } else if (this.is(TT.DOT)) {
        const d = this.advance();
        const prop = this.expect(TT.IDENT, 'Ожидалось имя свойства после .');
        expr = { type: Node.Member, object: expr, property: prop.value, line: d.line, col: d.col };
      } else break;
    }
    return expr;
  }
  parsePrimary() {
    const t = this.curr();
    if (this.is(TT.NUMBER)) { this.advance(); return { type: Node.Number, value: t.value, line: t.line, col: t.col }; }
    if (this.is(TT.STRING)) { this.advance(); return { type: Node.String, value: t.value, line: t.line, col: t.col }; }
    if (this.is(TT.TRUE))  { this.advance(); return { type: Node.Bool, value: true, line: t.line, col: t.col }; }
    if (this.is(TT.FALSE)) { this.advance(); return { type: Node.Bool, value: false, line: t.line, col: t.col }; }
    if (this.is(TT.NULL))  { this.advance(); return { type: Node.Null, line: t.line, col: t.col }; }
    if (this.is(TT.IDENT)) { this.advance(); return { type: Node.Ident, name: t.value, line: t.line, col: t.col }; }
    if (this.is(TT.LPAREN)) {
      this.advance(); const e = this.parseExpression();
      this.expect(TT.RPAREN, 'Ожидалась )');
      return e;
    }
    if (this.is(TT.LBRACKET)) {
      this.advance();
      const elements = [];
      if (!this.is(TT.RBRACKET)) do { elements.push(this.parseExpression()); } while (this.matchTok(TT.COMMA));
      this.expect(TT.RBRACKET, 'Ожидалась ]');
      return { type: Node.Array, elements, line: t.line, col: t.col };
    }
    if (this.is(TT.LBRACE)) {
      this.advance();
      const entries = [];
      if (!this.is(TT.RBRACE)) {
        do {
          const k = this.expect(TT.IDENT, 'Ожидался ключ объекта');
          this.expect(TT.COLON, 'Ожидалось : после ключа');
          entries.push([k.value, this.parseExpression()]);
        } while (this.matchTok(TT.COMMA));
      }
      this.expect(TT.RBRACE, 'Ожидалась }');
      return { type: Node.Object, entries, line: t.line, col: t.col };
    }
    throw new NovaError(`Неожиданный токен ${t.type} (${JSON.stringify(t.value)})`, t.line, t.col, 'Парсер');
  }
}

// ==================== ОКРУЖЕНИЕ ====================
class Environment {
  constructor(parent = null) {
    this.parent = parent; this.values = new Map(); this.constants = new Set();
  }
  define(name, value, isConst = false) {
    this.values.set(name, value);
    if (isConst) this.constants.add(name);
  }
  get(name) {
    let env = this;
    while (env) { if (env.values.has(name)) return env.values.get(name); env = env.parent; }
    return undefined;
  }
  has(name) {
    let env = this;
    while (env) { if (env.values.has(name)) return true; env = env.parent; }
    return false;
  }
  assign(name, value, line, col) {
    let env = this;
    while (env) {
      if (env.values.has(name)) {
        if (env.constants.has(name)) throw new NovaError(`Нельзя изменить константу '${name}'`, line, col, 'Время выполнения');
        env.values.set(name, value);
        return;
      }
      env = env.parent;
    }
    throw new NovaError(`Переменная '${name}' не определена`, line, col, 'Время выполнения');
  }
}

// ==================== УПРАВЛЯЮЩИЕ СИГНАЛЫ ====================
class ReturnSignal { constructor(value) { this.value = value; } }
class BreakSignal {}
class ContinueSignal {}

class NovaFunction {
  constructor(name, params, body, closure) {
    this.name = name; this.params = params; this.body = body; this.closure = closure;
  }
  toString() { return `<fn ${this.name || 'anonymous'}>`; }
}

// ==================== ИНТЕРПРЕТАТОР ====================
class Interpreter {
  constructor(output) {
    this.output = output;
    this.global = new Environment();
    this.setupBuiltins();
  }
  setupBuiltins() {
    const out = (s) => this.output(s);
    const def = (name, fn) => this.global.define(name, fn, true);
    def('print', (...args) => { out(args.map(a => this.stringify(a)).join(' ')); return null; });
    def('println', (...args) => { out(args.map(a => this.stringify(a)).join(' ')); return null; });
    def('str', (v) => this.stringify(v));
    def('num', (v) => { const n = Number(v); if (isNaN(n)) throw new Error(`num: '${this.stringify(v)}' не число`); return n; });
    def('type', (v) => this.typeOf(v));
    def('len', (v) => {
      if (typeof v === 'string' || Array.isArray(v)) return v.length;
      if (v instanceof Map) return v.size;
      throw new Error('len: неподдерживаемый тип');
    });
    def('push', (arr, ...items) => { if (!Array.isArray(arr)) throw new Error('push: ожидался массив'); arr.push(...items); return arr; });
    def('pop', (arr) => { if (!Array.isArray(arr)) throw new Error('pop: ожидался массив'); return arr.pop(); });
    def('keys', (obj) => { if (obj instanceof Map) return Array.from(obj.keys()); throw new Error('keys: ожидался объект'); });
    def('range', (a, b, step = 1) => {
      let start = a, end = b;
      if (b === undefined) { start = 0; end = a; }
      const res = [];
      if (step > 0) for (let i = start; i < end; i += step) res.push(i);
      else if (step < 0) for (let i = start; i > end; i += step) res.push(i);
      return res;
    });
    def('abs', (x) => Math.abs(x));
    def('sqrt', (x) => Math.sqrt(x));
    def('floor', (x) => Math.floor(x));
    def('ceil', (x) => Math.ceil(x));
    def('round', (x) => Math.round(x));
    def('min', (...a) => Math.min(...a));
    def('max', (...a) => Math.max(...a));
    def('random', () => Math.random());
    def('int', (x) => Math.trunc(x));
    def('PI', Math.PI);
    def('E', Math.E);
  }
  typeOf(v) {
    if (v === null) return 'null';
    if (typeof v === 'number') return 'number';
    if (typeof v === 'string') return 'string';
    if (typeof v === 'boolean') return 'boolean';
    if (Array.isArray(v)) return 'array';
    if (v instanceof Map) return 'object';
    if (v instanceof NovaFunction) return 'function';
    return 'unknown';
  }
  stringify(v) {
    if (v === null) return 'null';
    if (v === undefined) return 'undefined';
    if (typeof v === 'string') return v;
    if (typeof v === 'number') {
      if (Number.isInteger(v)) return v.toString();
      return v.toFixed(6).replace(/\.?0+$/, '');
    }
    if (typeof v === 'boolean') return v ? 'true' : 'false';
    if (Array.isArray(v)) return '[' + v.map(x => this.stringify(x)).join(', ') + ']';
    if (v instanceof Map) {
      const parts = [];
      for (const [k, val] of v) parts.push(`${k}: ${this.stringify(val)}`);
      return '{' + parts.join(', ') + '}';
    }
    if (v instanceof NovaFunction) return v.toString();
    return String(v);
  }
  execProgram(program) {
    const env = this.global;
    let result = null;
    for (const stmt of program.body) result = this.exec(stmt, env);
    return result;
  }
  exec(node, env) {
    switch (node.type) {
      case Node.Let: {
        const val = node.value ? this.eval(node.value, env) : null;
        env.define(node.name, val, node.constant);
        return null;
      }
      case Node.FnDecl: {
        const fn = new NovaFunction(node.name, node.params, node.body, env);
        env.define(node.name, fn, true);
        return null;
      }
      case Node.Block: {
        const blockEnv = new Environment(env);
        let r = null;
        for (const s of node.body) r = this.exec(s, blockEnv);
        return r;
      }
      case Node.If: {
        if (this.truthy(this.eval(node.cond, env))) return this.exec(node.then, env);
        else if (node.elseBranch) return this.exec(node.elseBranch, env);
        return null;
      }
      case Node.While: {
        while (this.truthy(this.eval(node.cond, env))) {
          try { this.exec(node.body, env); }
          catch (e) {
            if (e instanceof BreakSignal) break;
            if (e instanceof ContinueSignal) continue;
            throw e;
          }
        }
        return null;
      }
      case Node.For: {
        const forEnv = new Environment(env);
        if (node.init) {
          if (node.init.type === Node.Let) this.exec(node.init, forEnv);
          else this.eval(node.init, forEnv);
        }
        while (true) {
          if (node.cond && !this.truthy(this.eval(node.cond, forEnv))) break;
          try { this.exec(node.body, forEnv); }
          catch (e) {
            if (e instanceof BreakSignal) break;
            if (!(e instanceof ContinueSignal)) throw e;
          }
          if (node.update) this.eval(node.update, forEnv);
        }
        return null;
      }
      case Node.Return: throw new ReturnSignal(node.value ? this.eval(node.value, env) : null);
      case Node.Break: throw new BreakSignal();
      case Node.Continue: throw new ContinueSignal();
      case Node.ExprStmt: return this.eval(node.expr, env);
      default: throw new Error(`Неизвестный узел: ${node.type}`);
    }
  }
  eval(node, env) {
    switch (node.type) {
      case Node.Number: return node.value;
      case Node.String: return node.value;
      case Node.Bool: return node.value;
      case Node.Null: return null;
      case Node.Ident: {
        if (!env.has(node.name)) throw new NovaError(`Переменная '${node.name}' не определена`, node.line, node.col, 'Время выполнения');
        return env.get(node.name);
      }
      case Node.Array: return node.elements.map(e => this.eval(e, env));
      case Node.Object: {
        const obj = new Map();
        for (const [k, v] of node.entries) obj.set(k, this.eval(v, env));
        return obj;
      }
      case Node.Unary: {
        const v = this.eval(node.operand, env);
        if (node.op === '-') {
          if (typeof v !== 'number') throw new NovaError('Унарный - только к числам', node.line, node.col, 'Время выполнения');
          return -v;
        }
        if (node.op === '!') return !this.truthy(v);
        throw new Error('Неизвестный унарный оператор: ' + node.op);
      }
      case Node.Binary: {
        const l = this.eval(node.left, env);
        const r = this.eval(node.right, env);
        return this.binaryOp(node.op, l, r, node.line, node.col);
      }
      case Node.Logical: {
        const l = this.eval(node.left, env);
        if (node.op === '&&') return this.truthy(l) ? this.eval(node.right, env) : l;
        if (node.op === '||') return this.truthy(l) ? l : this.eval(node.right, env);
        throw new Error('Неизвестный логический оператор: ' + node.op);
      }
      case Node.Assign: {
        const val = this.eval(node.value, env);
        if (node.target.type === Node.Ident) { env.assign(node.target.name, val, node.line, node.col); return val; }
        if (node.target.type === Node.Index) {
          const obj = this.eval(node.target.object, env);
          const idx = this.eval(node.target.index, env);
          if (Array.isArray(obj)) { obj[Number(idx)] = val; return val; }
          if (obj instanceof Map) { obj.set(String(idx), val); return val; }
          throw new NovaError('Индексация неподдерживаемого типа', node.line, node.col, 'Время выполнения');
        }
        if (node.target.type === Node.Member) {
          const obj = this.eval(node.target.object, env);
          if (obj instanceof Map) { obj.set(node.target.property, val); return val; }
          throw new NovaError('Присваивание свойства — только для объектов', node.line, node.col, 'Время выполнения');
        }
        throw new Error('Недопустимая цель присваивания');
      }
      case Node.Index: {
        const obj = this.eval(node.object, env);
        const idx = this.eval(node.index, env);
        if (Array.isArray(obj)) {
          const i = Number(idx);
          if (!Number.isInteger(i)) throw new NovaError('Индекс массива должен быть целым', node.line, node.col, 'Время выполнения');
          return obj[i] === undefined ? null : obj[i];
        }
        if (typeof obj === 'string') return obj[Number(idx)] ?? null;
        if (obj instanceof Map) return obj.has(String(idx)) ? obj.get(String(idx)) : null;
        throw new NovaError(`Нельзя индексировать ${this.typeOf(obj)}`, node.line, node.col, 'Время выполнения');
      }
      case Node.Member: {
        const obj = this.eval(node.object, env);
        if (obj instanceof Map) return obj.has(node.property) ? obj.get(node.property) : null;
        throw new NovaError(`Нельзя получить свойство '${node.property}' у ${this.typeOf(obj)}`, node.line, node.col, 'Время выполнения');
      }
      case Node.Call: {
        const callee = this.eval(node.callee, env);
        const args = node.args.map(a => this.eval(a, env));
        return this.callFunction(callee, args, node);
      }
      default: throw new Error(`Неизвестный узел выражения: ${node.type}`);
    }
  }
  callFunction(callee, args, node) {
    if (callee instanceof NovaFunction) {
      if (args.length !== callee.params.length) {
        throw new NovaError(`Функция '${callee.name}' ожидает ${callee.params.length} аргументов, получено ${args.length}`, node.line, node.col, 'Время выполнения');
      }
      const callEnv = new Environment(callee.closure);
      for (let i = 0; i < callee.params.length; i++) callEnv.define(callee.params[i], args[i], false);
      try {
        let r = null;
        for (const s of callee.body) r = this.exec(s, callEnv);
        return r;
      } catch (e) {
        if (e instanceof ReturnSignal) return e.value;
        throw e;
      }
    }
    if (typeof callee === 'function') return callee(...args);
    throw new NovaError(`Не функция: ${this.stringify(callee)}`, node.line, node.col, 'Время выполнения');
  }
  binaryOp(op, l, r, line, col) {
    if (op === '+' && (typeof l === 'string' || typeof r === 'string')) return this.stringify(l) + this.stringify(r);
    if (op === '==') return this.equals(l, r);
    if (op === '!=') return !this.equals(l, r);
    if (typeof l !== 'number' || typeof r !== 'number') {
      throw new NovaError(`Оператор '${op}' требует числа, получено ${this.typeOf(l)} и ${this.typeOf(r)}`, line, col, 'Время выполнения');
    }
    switch (op) {
      case '+': return l + r;
      case '-': return l - r;
      case '*': return l * r;
      case '/': if (r === 0) throw new NovaError('Деление на ноль', line, col, 'Время выполнения'); return l / r;
      case '%': if (r === 0) throw new NovaError('Остаток от деления на ноль', line, col, 'Время выполнения'); return l % r;
      case '**': return Math.pow(l, r);
      case '<': return l < r;
      case '>': return l > r;
      case '<=': return l <= r;
      case '>=': return l >= r;
      default: throw new Error('Неизвестный оператор: ' + op);
    }
  }
  equals(a, b) {
    if (a === null && b === null) return true;
    if (typeof a !== typeof b) return false;
    if (typeof a !== 'object') return a === b;
    if (Array.isArray(a) && Array.isArray(b)) {
      if (a.length !== b.length) return false;
      for (let i = 0; i < a.length; i++) if (!this.equals(a[i], b[i])) return false;
      return true;
    }
    return a === b;
  }
  truthy(v) {
    if (v === null || v === false || v === 0 || v === '') return false;
    if (Array.isArray(v) && v.length === 0) return false;
    if (v instanceof Map && v.size === 0) return false;
    return true;
  }
}

// ============================================================
//  UI
// ============================================================
const outputEl = document.getElementById('output');
const replInput = document.getElementById('repl-input');
const currentFileEl = document.getElementById('current-file');
const modifiedDot = document.getElementById('modified-dot');

let currentFileName = 'untitled.nv';
let isModified = false;
let replInterpreter = null;
let saveTimer = null;

function setModified(v) {
  isModified = v;
  modifiedDot.classList.toggle('show', v);
}

// ---------------- Редактор (CodeMirror) ----------------
const editor = CodeMirror(document.getElementById('editor-container'), {
  value: '',
  mode: 'javascript', // используем JS-подсветку — синтаксис похож; можно сделать свой mode
  theme: 'material-darker',
  lineNumbers: true,
  indentUnit: 2,
  tabSize: 2,
  indentWithTabs: false,
  autoCloseBrackets: true,
  matchBrackets: true,
  styleActiveLine: true,
  lineWrapping: true,
  extraKeys: {
    'Ctrl-Enter': () => runCurrentFile(),
    'Cmd-Enter': () => runCurrentFile(),
    'Tab': (cm) => {
      if (cm.somethingSelected()) cm.indentSelection('add');
      else cm.replaceSelection('  ', 'end');
    }
  }
});

editor.on('change', () => setModified(true));

// ---------------- Вывод ----------------
function printLine(text, cls = '') {
  const div = document.createElement('div');
  div.className = 'out-line ' + cls;
  div.textContent = text;
  outputEl.appendChild(div);
  outputEl.scrollTop = outputEl.scrollHeight;
}
function clearOutput() { outputEl.innerHTML = ''; }

function toast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('err', isError);
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2000);
}

// ---------------- Запуск кода ----------------
function runSource(source, fromRepl = false) {
  try {
    const lexer = new Lexer(source);
    const tokens = lexer.tokenize();
    const parser = new Parser(tokens, source);
    const ast = parser.parse();
    let interpreter;
    if (fromRepl) {
      if (!replInterpreter) replInterpreter = new Interpreter(t => printLine(t, 'out-value'));
      interpreter = replInterpreter;
    } else {
      interpreter = new Interpreter(t => printLine(t, 'out-value'));
    }
    const result = interpreter.execProgram(ast);
    if (fromRepl && ast.body.length > 0) {
      const last = ast.body[ast.body.length - 1];
      if (last.type === Node.ExprStmt) {
        if (result !== null && result !== undefined) {
          printLine('=> ' + interpreter.stringify(result), 'out-info');
        }
      }
    }
    return true;
  } catch (e) {
    if (e instanceof NovaError) printLine(e.format(), 'out-error');
    else if (e instanceof ReturnSignal) printLine('Ошибка [Время выполнения]: return вне функции', 'out-error');
    else if (e instanceof BreakSignal) printLine('Ошибка [Время выполнения]: break вне цикла', 'out-error');
    else if (e instanceof ContinueSignal) printLine('Ошибка [Время выполнения]: continue вне цикла', 'out-error');
    else printLine('Ошибка: ' + (e.message || String(e)), 'out-error');
    return false;
  }
}

function runCurrentFile() {
  clearOutput();
  replInterpreter = null;
  printLine('▶ Запуск ' + currentFileName + '...', 'out-success');
  const t0 = performance.now();
  runSource(editor.getValue(), false);
  const dt = (performance.now() - t0).toFixed(2);
  printLine(`⏱ ${dt} мс`, 'out-muted');
}

// ---------------- Сохранение / загрузка ----------------
function saveFile() {
  const code = editor.getValue();
  const blob = new Blob([code], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = currentFileName.endsWith('.nv') ? currentFileName : currentFileName + '.nv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  setModified(false);
  toast('💾 Сохранено: ' + a.download);
}

function openFile(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    editor.setValue(e.target.result);
    currentFileName = file.name;
    currentFileEl.textContent = currentFileName;
    setModified(false);
    clearOutput();
    printLine(`📂 Открыт файл: ${file.name} (${e.target.result.length} симв.)`, 'out-success');
    toast('📂 Открыт: ' + file.name);
  };
  reader.onerror = () => toast('Не удалось прочитать файл', true);
  reader.readAsText(file, 'UTF-8');
}

function newFile() {
  if (isModified && !confirm('Есть несохранённые изменения. Создать новый файл?')) return;
  editor.setValue('');
  currentFileName = 'untitled.nv';
  currentFileEl.textContent = currentFileName;
  setModified(false);
  clearOutput();
  printLine('＋ Новый файл', 'out-info');
}

// ---------------- Кнопки ----------------
document.getElementById('btn-run').addEventListener('click', runCurrentFile);
document.getElementById('btn-save').addEventListener('click', saveFile);
document.getElementById('btn-new').addEventListener('click', newFile);
document.getElementById('btn-clear').addEventListener('click', clearOutput);

document.getElementById('file-input').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (file) openFile(file);
  e.target.value = '';
});

// Drag & drop
const dropOverlay = document.getElementById('drop-overlay');
let dragDepth = 0;
window.addEventListener('dragenter', (e) => {
  e.preventDefault();
  dragDepth++;
  dropOverlay.classList.add('show');
});
window.addEventListener('dragleave', (e) => {
  e.preventDefault();
  dragDepth--;
  if (dragDepth <= 0) { dragDepth = 0; dropOverlay.classList.remove('show'); }
});
window.addEventListener('dragover', (e) => e.preventDefault());
window.addEventListener('drop', (e) => {
  e.preventDefault();
  dragDepth = 0;
  dropOverlay.classList.remove('show');
  const file = e.dataTransfer.files[0];
  if (file) openFile(file);
});

// Ctrl+S — сохранить
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    saveFile();
  }
});

// Автосохранение состояния в localStorage
setInterval(() => {
  try {
    localStorage.setItem('nova_code', editor.getValue());
    localStorage.setItem('nova_filename', currentFileName);
  } catch (e) {}
}, 2000);

// Восстановление из localStorage
(function restoreState() {
  try {
    const savedCode = localStorage.getItem('nova_code');
    const savedName = localStorage.getItem('nova_filename');
    if (savedCode !== null && savedCode.length > 0) {
      editor.setValue(savedCode);
      currentFileName = savedName || 'untitled.nv';
      currentFileEl.textContent = currentFileName;
      setModified(false);
      printLine('↺ Восстановлено из прошлой сессии: ' + currentFileName, 'out-info');
      return;
    }
  } catch (e) {}
  loadStarter();
})();

function loadStarter() {
  editor.setValue(`// ============================================
//  NOVA v1.1 — добро пожаловать!
//  ▶ Запуск — Ctrl+Enter, 💾 — Ctrl+S, 📂 — drag&drop
// ============================================

let приветствие = "Привет, мир!";
print(приветствие);

fn фибоначчи(n) {
  if (n <= 1) { return n; }
  return фибоначчи(n - 1) + фибоначчи(n - 2);
}

let числа = [];
for (let i = 0; i < 10; i = i + 1) {
  push(числа, фибоначчи(i));
}
print("Фибоначчи:", числа);

let человек = {
  имя: "Алан",
  возраст: 42,
  языки: ["nova", "js", "c"]
};
print("Человек:", человек);
print("Зовут:", человек.имя);

// Замыкание
fn счётчик() {
  let n = 0;
  fn шаг() {
    n = n + 1;
    return n;
  }
  return шаг;
}
let счёт = счётчик();
счёт(); счёт();
print("Счётчик:", счёт());

print("");
print("✓ Готово. Внизу REPL, наверху — файлы.");
print("Команда help в REPL покажет справку.");
`);
  currentFileName = 'untitled.nv';
  currentFileEl.textContent = currentFileName;
  setModified(false);
  printLine('Nova v1.1 готова. Ctrl+Enter — запуск, help в REPL.', 'out-success');
}

// ---------------- REPL ----------------
const REPL_COMMANDS = {
  help() {
    printLine('────── Команды Nova REPL ──────', 'out-help');
    printLine('help              — эта справка', 'out-help');
    printLine('clear / cls       — очистить вывод', 'out-help');
    printLine('run               — запустить редактор', 'out-help');
    printLine('save              — сохранить файл', 'out-help');
    printLine('new               — новый файл', 'out-help');
    printLine('code              — показать код редактора', 'out-help');
    printLine('load <имя>        — открыть файл из localStorage', 'out-help');
    printLine('files             — список сохранённых файлов', 'out-help');
    printLine('reset             — очистить окружение REPL', 'out-help');
    printLine('version           — версия Nova', 'out-help');
    printLine('', 'out-help');
    printLine('Или введи любое выражение/инструкцию — выполнится сразу.', 'out-help');
    printLine('Переменные сохраняются между строками REPL.', 'out-help');
    printLine('───────────────────────────────', 'out-help');
  },
  clear() { clearOutput(); },
  cls() { clearOutput(); },
  run() { runCurrentFile(); },
  save() { saveFile(); },
  new() { newFile(); },
  reset() {
    replInterpreter = null;
    printLine('↺ Окружение REPL очищено', 'out-info');
  },
  version() {
    printLine('Nova v1.1 — интерпретируемый язык на JS', 'out-info');
    printLine('Лексер + Pratt-парсер + tree-walking интерпретатор', 'out-info');
  },
  code() {
    printLine('────── Код редактора ──────', 'out-muted');
    editor.getValue().split('\n').forEach((l, i) => printLine(`${i + 1}│ ${l}`, 'out-muted'));
    printLine('───────────────────────────', 'out-muted');
  },
  files() {
    try {
      const files = JSON.parse(localStorage.getItem('nova_files') || '{}');
      const names = Object.keys(files);
      if (!names.length) { printLine('Нет сохранённых файлов', 'out-muted'); return; }
      printLine('Сохранённые файлы:', 'out-help');
      names.forEach(n => printLine('  ' + n, 'out-help'));
    } catch (e) { printLine('Ошибка чтения файлов', 'out-error'); }
  },
  load(args) {
    const name = args.join(' ').trim();
    if (!name) { printLine('Использование: load <имя>', 'out-warn'); return; }
    try {
      const files = JSON.parse(localStorage.getItem('nova_files') || '{}');
      if (!files[name]) { printLine('Файл не найден: ' + name, 'out-error'); return; }
      editor.setValue(files[name]);
      currentFileName = name;
      currentFileEl.textContent = name;
      setModified(false);
      printLine('📂 Загружен: ' + name, 'out-success');
    } catch (e) { printLine('Ошибка загрузки', 'out-error'); }
  }
};

replInput.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  const src = replInput.value.trim();
  replInput.value = '';
  if (!src) return;
  printLine('nova> ' + src, 'out-muted');

  // Команды — только если это одно слово / команда с аргументами
  const parts = src.split(/\s+/);
  const cmdName = parts[0].toLowerCase();
  if (REPL_COMMANDS[cmdName]) {
    REPL_COMMANDS[cmdName](parts.slice(1));
    return;
  }

  // Иначе — интерпретируем как код
  if (!replInterpreter) replInterpreter = new Interpreter(t => printLine(t, 'out-value'));
  runSource(src, true);
});

// Приветствие при загрузке
printLine('Nova v1.1 — help в REPL для справки', 'out-success');
</script>
